name: Android app

# A free Android app (APK) that opens the live web app full screen (Trusted Web Activity).
# Push a tag like v1.0.0 to publish it under Releases. Other runs only prove the build works.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["twa-manifest.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to attach the APK to the release of a tag
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD first (see README)."; exit 1
          else
            echo "No signing secrets: test build with a throwaway key (not published)."
            P="test-$(openssl rand -hex 8)"
            keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias meronpa -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=test" -storepass "$P" -keypass "$P"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
          fi

      - name: Android SDK and Bubblewrap
        run: |
          # Bubblewrap wants an SDK folder that has bin/sdkmanager at its top: copy the runner's command-line tools there.
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK" && cp -r "$ANDROID_HOME/cmdline-tools/latest/." "$SDK/"
          yes | "$SDK/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;36.1.0" "platforms;android-36" > /dev/null
          npm install -g @bubblewrap/cli@1.27.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV" # the runner sets its own; Gradle refuses two different ones

      - name: Version from the tag
        if: env.IS_RELEASE == 'true'
        run: |
          V="${GITHUB_REF_NAME#v}"
          CODE=$(( $(echo "$V" | cut -d. -f1) * 10000 + $(echo "$V" | cut -d. -f2) * 100 + $(echo "$V" | cut -d. -f3) ))
          node -e 'const f="twa-manifest.json",m=JSON.parse(require("fs").readFileSync(f));m.appVersionName=m.appVersion=process.argv[1];m.appVersionCode=Number(process.argv[2]);require("fs").writeFileSync(f,JSON.stringify(m,null,2))' "$V" "$CODE"

      - name: Build the APK
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json < /dev/null
          yes | bubblewrap build --skipPwaValidation --manifest=twa-manifest.json
          ls -la app-release-signed.apk

      - name: Check the APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging app-release-signed.apk | grep -E "^package:|application-label:'"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app-release-signed.apk | grep -E "Signer #1 certificate SHA-256"

      - name: Publish to the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-release-signed.apk "Meron-Pa-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Meron-Pa-${GITHUB_REF_NAME}.apk" --repo "$GITHUB_REPOSITORY" \
            --title "Meron Pa? ${GITHUB_REF_NAME}" --notes "Android app. Download the .apk on your phone, allow installing from your browser when asked, then open it. Updates to the website reach the app automatically."
